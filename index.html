<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totito|Ejercicio</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="shortcut icon" href="./noughts-and-crosses.png" type="image/x-icon">

</head>

<body>


    <div class="titulo">
        <h1 class="title">🍓 Let's Play "TOTITO" 🍓</h1>
    </div>

    <div class="contenedorAlertas">

        <div id="alerta-turno" class="alert alerta-yo-X" role="alert">
            You got it, player <strong id="nombre-jugador" class="jugador">X</strong>
        </div>

        <div id="alerta-turno2" class="alert alerta-yo-O" role="alert">
            Think twice, player <strong id="nombre-jugador" class="jugador2">O</strong>
        </div>

        <div id="alerta-ganador" class="alert alerta-yo-winner d-none" role="alert">
            ✨ The Winner is: <strong id="ganador-letra" class="jugadorW"></strong>! ✨
        </div>

        <div id="alerta-empate" class="alert alert-secondary alerta-yo-empate d-none" role="alert">
            It's a double-take!
        </div>
    </div>

    <div class="contenedorGeneral">
        <div class="contenedorMarcador">
            <div class="marcador">
                <h3 class="fs-1 p-4 fw-bold victorias">👑 Marcador de victorias 👑</h3>
                <p class="marcadorX">🪄 Player X: 0</p><br>
                <p class="marcadorO">🎧 Player O: 0</p> <br>
                <p class="marcadorEmpates">🤍 Dead heat: 0</p> <br>
            </div>
        </div>

        <div class="contenedor1">
            <div class="contenedor-Totito">

                <button class="caja uno" id="1"></button>
                <button class="caja dos" id="2"></button>
                <button class="caja tres" id="3"></button>
                <button class="caja cuatro" id="4"></button>
                <button class="caja cinco" id="5"></button>
                <button class="caja seis" id="6"></button>
                <button class="caja siete" id="7"></button>
                <button class="caja ocho" id="8"></button>
                <button class="caja nueve" id="9"></button>

            </div>

            <div class="boton-de-reinicio">
                <button class="botonReinicio">Reset</button>
            </div>

        </div>

    </div>

    <!-- ancla -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>

</html>
